name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config database routes tests -name '*.php' -not -path '*/build/*' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        shell: bash
        run: |
          set +e
          composer test 2>&1 | tee /tmp/phpunit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 60 /tmp/phpunit.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PHPUnit failed::$message"
          fi
          exit "$status"
      - run: composer analyse
