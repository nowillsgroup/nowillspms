name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config database routes tests -name '*.php' -not -path '*/build/*' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer analyse
